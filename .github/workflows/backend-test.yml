name: Test Backend

permissions:
  contents: read

on:
  pull_request:
  push:

jobs:
  build:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install dependencies
        run: |
          sudo apt update -q
          sudo apt install -y -q python3-gdal

      - name: start database
        run: |
          docker compose -f docker/docker-compose.database.yml up -d

      - name: wait for database
        run: |
          for _ in $(seq 1 30); do
            if docker compose -f docker/docker-compose.database.yml exec -T db pg_isready -U adventure; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: install python libraries
        working-directory: backend/server
        run: pip install -r requirements-dev.txt

      - name: check for unused and undefined names
        working-directory: backend/server
        run: flake8 --config .flake8 .

      - name: check app boundaries
        working-directory: backend/server
        env:
          PYTHONPATH: "."
        run: lint-imports

      - name: run tests
        working-directory: backend/server
        env:
          PGHOST: "127.0.0.1"
          PGDATABASE: "database"
          PGUSER: "adventure"
          PGPASSWORD: "changeme123"
          SECRET_KEY: "changeme123"
          DJANGO_ADMIN_USERNAME: "admin"
          DJANGO_ADMIN_PASSWORD: "admin"
          DJANGO_ADMIN_EMAIL: "admin@example.com"
          PUBLIC_URL: "http://localhost:8000"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://localhost:8000"
          DEBUG: "True"
          FRONTEND_URL: "http://localhost:5173"
          DJANGO_SETTINGS_MODULE: "main.test_settings"
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py test --verbosity=1

      # The API documents itself: the schema must be valid OpenAPI, generate without warnings,
      # and match the committed openapi/schema.yaml (see API.md).
      - name: check the OpenAPI schema
        working-directory: backend/server
        env:
          PGHOST: "127.0.0.1"
          PGDATABASE: "database"
          PGUSER: "adventure"
          PGPASSWORD: "changeme123"
          SECRET_KEY: "changeme123"
          PUBLIC_URL: "http://localhost:8000"
          FRONTEND_URL: "http://localhost:5173"
          DJANGO_SETTINGS_MODULE: "main.test_settings"
        run: |
          python manage.py spectacular --file openapi/schema.yaml --validate --fail-on-warn
          git diff --exit-code openapi/schema.yaml
