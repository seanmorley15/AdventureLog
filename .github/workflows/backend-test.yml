name: Test Backend

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker/docker-compose.database.yml"
      - ".github/workflows/backend-test.yml"
  push:
    paths:
      - "backend/**"
      - "docker/docker-compose.database.yml"
      - ".github/workflows/backend-test.yml"

concurrency:
  group: backend-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: database
          POSTGRES_USER: adventure
          POSTGRES_PASSWORD: changeme123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adventure -d database"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGDATABASE: "database"
      PGUSER: "adventure"
      PGPASSWORD: "changeme123"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DJANGO_SETTINGS_MODULE: "main.settings_test"
      DJANGO_ADMIN_USERNAME: "admin"
      DJANGO_ADMIN_PASSWORD: "admin"
      DJANGO_ADMIN_EMAIL: "admin@example.com"
      PUBLIC_URL: "http://localhost:8000"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://localhost:8000"
      DEBUG: "True"
      FRONTEND_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/server/requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q python3-gdal gdal-bin libgdal-dev

      - name: Install Python dependencies
        working-directory: backend/server
        run: pip install -r requirements-dev.txt

      - name: Run Django tests with coverage
        working-directory: backend/server
        run: |
          python -m coverage run --source='.' manage.py test --verbosity=2
          python -m coverage report --show-missing
          python -m coverage xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/server/coverage.xml
          if-no-files-found: ignore

      - name: Write coverage summary
        if: always()
        working-directory: backend/server
        run: |
          {
            echo "## Backend test coverage"
            echo ""
            echo '```'
            python -m coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
