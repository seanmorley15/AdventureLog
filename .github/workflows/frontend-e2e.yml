name: Test Frontend (E2E)

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - "scripts/e2e-stack.sh"
      - ".github/workflows/frontend-e2e.yml"
  push:
    branches:
      - main
      - development
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - "scripts/e2e-stack.sh"
      - ".github/workflows/frontend-e2e.yml"

env:
  E2E_IMAGE: adventurelog-e2e

jobs:
  build:
    name: Build the production image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the all-in-one image
        run: |
          docker buildx build -f docker/Dockerfile --target aio -t "$E2E_IMAGE" \
            --cache-from type=gha --cache-to type=gha,mode=max --load .
          docker save "$E2E_IMAGE" | gzip > "$RUNNER_TEMP/image.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-image
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          compression-level: 0

  e2e:
    name: E2E (shard ${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-image
          path: ${{ runner.temp }}

      - name: Load the image and start the stack
        run: |
          gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load
          E2E_SKIP_BUILD=1 scripts/e2e-stack.sh up

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.32.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        working-directory: frontend
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run the E2E suite
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8015
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3

      - name: Collect app logs
        if: always()
        run: scripts/e2e-stack.sh logs-dump > "$RUNNER_TEMP/app.log" 2>&1 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            frontend/blob-report
            frontend/test-results
            ${{ runner.temp }}/app.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: scripts/e2e-stack.sh down

  report:
    name: Merge reports
    if: always() && needs.build.result == 'success'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.32.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: e2e-results-*
          path: ${{ runner.temp }}/results
          merge-multiple: false

      - name: Merge blob reports into one HTML report
        working-directory: frontend
        run: |
          mkdir -p all-blobs
          find "$RUNNER_TEMP/results" -path '*blob-report/*' -type f -exec cp {} all-blobs/ \;
          pnpm exec playwright merge-reports --reporter html ./all-blobs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
