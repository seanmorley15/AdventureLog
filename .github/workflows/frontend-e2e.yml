name: Test Frontend (E2E)

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - "scripts/e2e-stack.sh"
      - ".github/workflows/frontend-e2e.yml"
  push:
    branches:
      - main
      - development
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - "scripts/e2e-stack.sh"
      - ".github/workflows/frontend-e2e.yml"

env:
  E2E_IMAGE: adventurelog-e2e

jobs:
  build:
    name: Build the production image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the all-in-one image
        run: |
          docker buildx build -f docker/Dockerfile --target aio -t "$E2E_IMAGE" \
            --cache-from type=gha --cache-to type=gha,mode=max --load .
          docker save "$E2E_IMAGE" | gzip > "$RUNNER_TEMP/image.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-image
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          compression-level: 0

  e2e:
    name: E2E (shard ${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-image
          path: ${{ runner.temp }}

      - name: Load the image and start the stack
        run: |
          gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load
          E2E_SKIP_BUILD=1 scripts/e2e-stack.sh up

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.32.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        working-directory: frontend
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run the E2E suite
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8015
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3

      - name: Collect app logs
        if: always()
        run: scripts/e2e-stack.sh logs-dump > "$RUNNER_TEMP/app.log" 2>&1 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            frontend/blob-report
            frontend/test-results
            ${{ runner.temp }}/app.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: scripts/e2e-stack.sh down

  report:
    name: Merge reports
    if: always() && needs.build.result == 'success'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.32.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-results-*
          path: ${{ runner.temp }}/results
          merge-multiple: false

      - name: Merge blob reports into one HTML report
        working-directory: frontend
        run: |
          mkdir -p all-blobs
          find "$RUNNER_TEMP/results" -path '*blob-report/*' -type f -exec cp {} all-blobs/ \;
          pnpm exec playwright merge-reports --reporter html ./all-blobs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
