name: Test Frontend

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/server/openapi/schema.yaml"
      - ".github/workflows/frontend-test.yml"
  push:
    paths:
      - "frontend/**"
      - "backend/server/openapi/schema.yaml"
      - ".github/workflows/frontend-test.yml"

jobs:
  quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.32.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: run lint
        working-directory: frontend
        run: pnpm run lint

      # The API types are generated from the backend schema; they must be up to date.
      - name: check generated API types
        working-directory: frontend
        run: |
          pnpm run api:types
          git diff --exit-code src/lib/api/schema.d.ts

      - name: run svelte check
        working-directory: frontend
        run: pnpm run check

      - name: unit tests with coverage
        working-directory: frontend
        run: pnpm run test:coverage

      - name: install Chromium for component tests
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: component tests
        working-directory: frontend
        run: pnpm run test:component

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: ignore

      - name: build frontend
        working-directory: frontend
        run: pnpm run build
