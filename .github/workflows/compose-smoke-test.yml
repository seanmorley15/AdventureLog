name: Compose Smoke Test

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docker/aio/**'
      - 'frontend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/compose-smoke-test.yml'
  push:
    branches:
      - main
      - development
    paths:
      - 'backend/**'
      - 'docker/aio/**'
      - 'frontend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/compose-smoke-test.yml'

jobs:
  aio-smoke:
    name: Standard Deployment compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Standard Deployment image
        run: |
          docker build -f docker/Dockerfile --target aio -t adventurelog-smoke .
          SIZE=$(docker image inspect adventurelog-smoke --format='{{.Size}}')
          echo "Standard Deployment image size: $(awk "BEGIN {printf \"%.1f MB\", ${SIZE}/1024/1024}")"

      - name: Start Standard Deployment stack
        run: |
          printf '%s\n' 'POSTGRES_PASSWORD=smoke-test-pass' > .env
          # The stock compose file pulls :latest. This job must run the image built above.
          # /health only checks the database, so skip the first-boot geography import.
          cat > docker-compose.smoke.override.yml << 'EOF'
          services:
            app:
              image: adventurelog-smoke
              pull_policy: never
              environment:
                SKIP_WORLD_DATA: "1"
          EOF
          compose() {
            docker compose --env-file .env \
              -f docker-compose.yml \
              -f docker-compose.smoke.override.yml \
              "$@"
          }
          if ! compose up -d --wait; then
            echo "Compose stack failed to become healthy"
            compose ps || true
            compose logs || true
            exit 1
          fi

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8015/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.smoke.override.yml \
            ps
          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.smoke.override.yml \
            logs
          exit 1

      - name: Tear down
        if: always()
        run: |
          printf '%s\n' 'POSTGRES_PASSWORD=smoke-test-pass' > .env
          files=(-f docker-compose.yml)
          if [[ -f docker-compose.smoke.override.yml ]]; then
            files+=(-f docker-compose.smoke.override.yml)
          fi
          docker compose --env-file .env "${files[@]}" down -v
