    _PasswordPolicy:
      type: object
      properties:
        min_length:
          type: integer
        validators_enabled:
          type: boolean
          description: True when Django's password strength checks (common, numeric,
            similar) are on.
      required:
      - min_length
      - validators_enabled
    _Person:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      required:
      - first_name
      - last_name
      - username
      - uuid
    _PlanCollection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        timezone:
          type: string
          nullable: true
        day_count:
          type: integer
          nullable: true
        updated_at:
          type: string
          format: date-time
      required:
      - day_count
      - end_date
      - id
      - start_date
      - timezone
      - updated_at
    _Registration:
      type: object
      properties:
        enabled:
          type: boolean
        message:
          type: string
          nullable: true
          description: Shown when sign-up is closed.
      required:
      - enabled
      - message
    _SocialProvider:
      type: object
      properties:
        provider:
          type: string
          description: e.g. `github`, `openid_connect`.
        name:
          type: string
        url:
          type: string
          format: uri
          description: Open this in the browser to sign in with the provider.
        usage_required:
          type: boolean
          description: True when password sign-in is disabled on this server.
      required:
      - name
      - provider
      - url
      - usage_required
    AllauthResponse:
      type: object
      description: django-allauth's success envelope.
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          description: 'The result: a user, a list of emails, authenticators...'
        meta:
          type: object
          description: 'e.g. `{"is_authenticated": true}`.'
    AllauthErrorResponse:
      type: object
      description: django-allauth's error envelope.
      properties:
        status:
          type: integer
          example: 400
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              code:
                type: string
                example: password_too_short
              param:
                type: string
                example: password
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: An API key from Settings → Security, e.g. `al_xxxxxxxx…`.
    ApiKeyAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: The same key as `Api-Key al_xxxxxxxx…`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
  responses:
    AllauthOk:
      description: Done.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthResponse'
    AllauthError:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthErrorResponse'
    AllauthUnauthenticated:
      description: Not (fully) signed in. `data.flows` lists what can happen next,
        e.g. a pending `mfa_authenticate` or `verify_email` flow, or `reauthenticate`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthResponse'
  requestBodies:
    AllauthEmail:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - email
            properties:
              email:
                type: string
                format: email
tags:
- name: Authentication
  description: Sign in and out, sign up, passwords, two-factor authentication, and
    what the sign-in screens need to know first.
- name: Account
  description: 'The signed-in user: profile, settings, API keys, storage, deletion.'
- name: Users
  description: Public profiles of other users.
- name: Locations
  description: Places you have been or want to go.
- name: Visits
  description: Dated visits to a location.
- name: Activities
  description: Recorded activities (a hike, a ride) with optional GPX tracks.
- name: Trails
  description: Links to trails, optionally from a Wanderer server.
- name: Categories & tags
  description: Your location categories and the tags used on your locations.
- name: Collections
  description: Folders and trips that group places and plans.
- name: Sharing
  description: Invites, members and their roles, and guest links for a collection.
- name: Comments
  description: Discussion on a collection's plan or story, and your comment inbox.
- name: Day plan
  description: The days of a trip and the items placed on them.
- name: Trip items
  description: Lodging, transportation, notes and checklists.
- name: Media
  description: Images and file attachments on any record.
- name: Places
  description: Search, geocoding, descriptions and recommendations from map providers.
- name: Calendar
  description: Your visits, stays and trips as calendar events or an iCalendar file.
- name: Search
  description: Search across everything you can see.
- name: Dashboard
  description: The home screen summary.
- name: Backup
  description: Export and restore your whole account.
- name: World travel
  description: Countries, regions and cities, and which of them you have visited.
- name: Integrations
  description: Immich, Strava, Wanderer and Endurain.
- name: Billing
  description: Subscriptions on hosted (cloud) servers.
- name: Server
  description: Information about this server.
