  /api/places/description/:
    get:
      operationId: places_describe
      description: |-
        A short plain-text description of a place or topic from Wikipedia, or from Google's
                place summary and reviews with `source=google`.
      summary: Get a description
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          minLength: 1
        description: Wikipedia language, e.g. `en`. Defaults to English.
      - in: query
        name: name
        schema:
          type: string
          minLength: 1
        description: The place or topic to describe.
        required: true
      - in: query
        name: place_id
        schema:
          type: string
          minLength: 1
        description: With `source=google`, describe this exact place.
      - in: query
        name: source
        schema:
          enum:
          - wikipedia
          - google
          type: string
          default: wikipedia
          minLength: 1
        description: |-
          * `wikipedia` - wikipedia
          * `google` - google
      tags:
      - Places
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Description'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The request was not valid. `fields` lists the problems for
            each input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '404':
          description: Nothing was found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Too many requests (`throttled`). Wait and retry.
        '502':
          description: The provider failed (`upstream_error`).
        '503':
          description: '`source=google` but Google Maps is not set up (`not_configured`).'
