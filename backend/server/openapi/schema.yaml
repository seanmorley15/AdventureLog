        '400':
          description: Invalid input, or `location` could not be found (`location_not_found`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Too many requests (`throttled`). Wait and retry.
        '503':
