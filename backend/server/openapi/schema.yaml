  /api/recommendations/:
    get:
      operationId: recommendations_list
      description: |-
        Places to stay (`lodging`), eat (`food`) or see (`tourism`) within `radius` meters of a
                point, ranked by quality and distance and de-duplicated across providers. Give the point
                as `lat` and `lon`, or as a `location` name to look up first.
      summary: Find recommendations nearby
      parameters:
      - in: query
        name: category
        schema:
          enum:
          - lodging
          - food
          - tourism
          type: string
          minLength: 1
        description: |-
          * `lodging` - lodging
          * `food` - food
          * `tourism` - tourism
        required: true
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
      - in: query
        name: location
        schema:
          type: string
          minLength: 1
        description: A place name to search around, instead of `lat` and `lon`.
      - in: query
        name: lon
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
      - in: query
        name: radius
        schema:
          type: number
          format: double
          minimum: 1
          default: 5000.0
        description: Meters. At most 50000.
      - in: query
        name: sources
        schema:
          enum:
          - google
          - osm
          - both
          type: string
          default: both
          minLength: 1
        description: |-
          * `google` - google
          * `osm` - osm
          * `both` - both
      tags:
      - Places
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendationResponse'
