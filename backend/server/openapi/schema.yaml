            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You can see this resource but may not do this to it (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The resource does not exist, or you cannot see it (`not_found`).
        '413':
