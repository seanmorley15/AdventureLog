      operationId: immich_asset
      description: |-
        Serves a photo from the owner's Immich server. Anyone who can see a record the photo
                is on can load it, also without signing in for public records; the owner can load
                any photo from their server.
      summary: Show an Immich photo
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
        description: The Immich asset id.
        required: true
      - in: path
        name: integration_id
        schema:
          type: string
          format: uuid
        description: The Immich connection the photo comes from.
        required: true
      tags:
      - Integrations
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            image/*:
              schema:
                type: string
                format: binary
          description: A preview-sized image.
        '403':
          description: The photo is on records you cannot see (`immich.permission_denied`).
        '404':
          description: Unknown connection, or the photo is not on any record (`immich.not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Too many requests (`throttled`). Wait and retry.
        '502':
          description: Immich did not return an image (`immich.invalid_content`).
        '503':
          description: Your Immich server is unreachable (`immich.server_down`).
        '504':
          description: Immich was too slow (`immich.timeout`).
  /api/integrations/immich/search/:
    get:
      operationId: immich_search
      description: Smart search by `query`, or the photos taken on a `date`.
      summary: Search your photos
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Photos taken on this day.
      - in: query
        name: query
        schema:
          type: string
          minLength: 1
        description: Smart (CLIP) search text.
      tags:
      - Integrations
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImmichAssetList'
          description: A page of assets (`?page=`, `?page_size=`).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The request was not valid. `fields` lists the problems for
            each input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '404':
          description: Nothing found, or not connected.
        '503':
          description: Your Immich server is unreachable (`immich.server_down`).
