    APIKey:
      type: object
      description: |-
        Read serializer for APIKey – never exposes the key_hash or the raw token.
        The raw token is injected by the view only at creation time via an extra
        ``key`` field that is *not* part of the model serializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        key_prefix:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - key_prefix
      - last_used_at
      - name
    APIKeyCreateRequest:
      type: object
      description: Write serializer – only accepts a ``name`` for the new key.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    APIKeyCreated:
      type: object
      description: |-
        Read serializer for APIKey – never exposes the key_hash or the raw token.
        The raw token is injected by the view only at creation time via an extra
        ``key`` field that is *not* part of the model serializer.
