    get:
      operationId: locations_list
      description: |-
        The places you own, a page at a time, in a light form (no trails, files or GPS
                tracks). Filter by category, visited status and whether they are in a collection.
                Places in collections shared with you are listed with the collection.
      summary: List your locations
      parameters:
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
        description: Comma-separated category names. All categories by default.
      - in: query
        name: in_collection
        schema:
          type: boolean
          nullable: true
        description: '`true`: only places in at least one collection. `false`: only
          places in none.'
      - in: query
        name: is_visited
        schema:
          type: boolean
          nullable: true
        description: '`true`: only places with a past visit. `false`: only places
          without one.'
      - in: query
        name: ordering
        schema:
          enum:
          - name
          - -name
          - updated_at
          - -updated_at
          - date
          - -date
          - rating
          - -rating
          type: string
          default: -updated_at
          minLength: 1
        description: |-
          `date` sorts by the latest visit and `rating` by rating; places without one come last.

          * `name` - name
          * `-name` - -name
          * `updated_at` - updated_at
          * `-updated_at` - -updated_at
          * `date` - date
          * `-date` - -date
          * `rating` - rating
          * `-rating` - -rating
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
