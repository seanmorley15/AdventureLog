  /api/collections/:
    get:
      operationId: collections_list
      description: |-
        Your collections, or with `membership=shared` the ones shared with you, a page at a
                time, as cards (no records inside).
      summary: List collections
      parameters:
      - in: query
        name: archived
        schema:
          type: boolean
          nullable: true
        description: Only archived (`true`) or only active (`false`) collections.
          Your own collections default to active only; shared ones to both.
      - in: query
        name: membership
        schema:
          enum:
          - owned
          - shared
          type: string
          default: owned
          minLength: 1
        description: |-
          `owned`: collections you own. `shared`: collections others shared with you.

          * `owned` - owned
          * `shared` - shared
      - in: query
        name: ordering
        schema:
          enum:
          - name
          - -name
          - updated_at
          - -updated_at
          - start_date
          - -start_date
          type: string
          default: name
          minLength: 1
        description: |-
          Collections without a start date come last when sorting by it.

          * `name` - name
          * `-name` - -name
          * `updated_at` - updated_at
          * `-updated_at` - -updated_at
          * `start_date` - start_date
          * `-start_date` - -start_date
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - upcoming
          - in_progress
          - completed
          type: string
          minLength: 1
        description: |-
          By the trip dates.

          * `upcoming` - upcoming
          * `in_progress` - in_progress
          * `completed` - completed
      - in: query
        name: type
        schema:
          enum:
          - folder
          - trip
          type: string
          minLength: 1
        description: |-
          * `folder` - Folder
          * `trip` - Trip
