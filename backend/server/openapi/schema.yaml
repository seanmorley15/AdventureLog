openapi: 3.0.3
info:
  title: AdventureLog API
  version: 1.0.0
  description: |2

    The AdventureLog API is what the AdventureLog web app itself uses. Everything here is
    available to your own scripts and integrations.

    ## Base URL

    Every endpoint lives under `/api/` on your AdventureLog domain, for example
    `https://adventurelog.example.com/api/locations/`. Paths end with a slash.

    ## Authentication

    Send **one** of these with each request:

    | Method | How | Notes |
    |---|---|---|
    | API key | `X-API-Key: al_…` | Create keys in **Settings → Security**. Best for scripts. |
    | API key | `Authorization: Api-Key al_…` | The same key in the standard header. |
    | Session | the `sessionid` cookie set by `POST /api/auth/browser/v1/auth/login` | Used by the web app. Requests that change data must also send `X-CSRFToken` with the token from `GET /api/auth/csrf/`. |

    ```bash
    curl https://adventurelog.example.com/api/locations/ -H "X-API-Key: al_your_key"
    ```

    An invalid key is rejected with `401` and is not combined with a session. Endpoints marked
    with no lock in this page work without signing in; most of them show more when you are
    signed in (for example a public collection versus your own).

    In the interactive docs, click **Authorize** and paste an API key, or sign in to the web app
    in the same browser.

    ## Errors

    Every error is JSON with the same shape:

    ```json
    {"detail": "Location not found.", "code": "not_found"}
    ```

    Validation errors (`400`) add `fields`, with the messages for each input:

    ```json
    {"detail": "name: This field is required.", "code": "validation_error",
     "fields": {"name": ["This field is required."]}}
    ```

    `detail` is safe to show to people. `code` is stable and meant for programs. Some errors add
    context next to them, for example the storage numbers on `413 media_quota_exceeded`.

    | Status | Meaning |
    |---|---|
    | 400 | The request was not valid (`validation_error`, or a specific code). |
    | 401 | Not signed in (`not_authenticated`) or a bad API key (`authentication_failed`). |
    | 402 | Hosted (cloud) servers only: the account needs a subscription (`subscription_required`). |
    | 403 | You can see the resource but may not do this (`permission_denied`). |
    | 404 | It does not exist, or you cannot see it (`not_found`). |
    | 409 | It conflicts with the current state, e.g. it already exists (`conflict`). |
    | 413 | The upload would exceed your media storage (`media_quota_exceeded`). |
    | 429 | Too many requests (`throttled`). Servers can turn on rate limits. |
    | 502 / 503 / 504 | An outside service (a map provider, Immich, Strava…) failed, is not set up, or timed out. |

    ## Lists and pagination

    Lists that can grow without bound are paged with `?page=` and `?page_size=` (at most 1000)
    and return

    ```json
    {"count": 120, "next": "…?page=2", "previous": null, "results": [ … ]}
    ```

    Search and picker endpoints take `?limit=` and `?offset=` and return `{"count", "results"}`.
    Lists that belong to one parent (the days of a trip, a collection's comments) are returned
    whole, as an array.

    Sort with `?ordering=field` (ascending) or `?ordering=-field` (descending) where an
    endpoint lists the fields it accepts. Booleans in query strings are `true` or `false`.

    ## Collections, trips and the day plan

    A **collection** groups places and plans. A collection of type `trip` has a **day plan**:
    numbered days (`/api/collections/{id}/days/`) and **itinerary items** that place a location,
    lodging, transportation, note or checklist on a day, in the trip-wide list, or in Ideas
    (`/api/collections/{id}/itinerary-items/`). Collections can be shared with other users
    (roles `editor` and `viewer`) and through guest links.

    ## Uploads and downloads

    Uploads use `multipart/form-data` (images, attachments, GPX files, backups). Downloads
    (PDF, PNG share cards, zip archives, iCalendar, GPX) return the file with a
    `Content-Disposition` header.

    ## Sign-in endpoints

    `/api/auth/browser/v1/…` and `/api/auth/app/v1/…` are provided by django-allauth's headless
    API and answer in its own format (`{"status", "data", "meta"}` or `{"status", "errors"}`).
    The **Authentication** section documents the ones the web app uses.
paths:
  /api/account/:
    get:
      operationId: account_retrieve
      description: |-
        Your profile plus what the app's header shows: how many collection invites are waiting
                and how many comments you have not read. On hosted servers the subscription is included.
      summary: Get your account
      tags:
      - Account
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedAccount'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
    patch:
      operationId: account_partial_update
      description: |-
        Change your profile and preferences. Send JSON, or `multipart/form-data` to upload a new `profile_pic`.

        Turning `public_profile` off also removes you from collections other people shared with you and cancels invites you have not answered. The response then includes `left_shared_collections` and `revoked_collection_invites` with how many were affected.
      summary: Update your profile
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserDetailsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserDetailsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserDetailsRequest'
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUserDetails'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The request was not valid. `fields` lists the problems for
            each input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You can see this resource but may not do this to it (`permission_denied`).
        '413':
          description: The new profile picture would exceed your media storage.
    delete:
      operationId: account_destroy
      description: |-
        Permanently deletes the account and everything it owns. Send your username as
                `confirmation`, and your `password` unless the account signs in only through a social
                provider. On hosted servers the subscription is cancelled first. Ends the session.
      summary: Delete your account
      tags:
      - Account
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '204':
          description: The account and everything it owns were deleted.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '403':
          description: Staff accounts cannot delete themselves here.
        '502':
          description: The hosted billing provider could not be cleaned up; nothing
            was deleted.
  /api/account/api-keys/:
    get:
      operationId: account_api_keys_list
      description: |-
        Each key shows its name and the first characters (`key_prefix`) so you can tell them
                apart. The key itself is never shown again after it is created. The mobile app's key is
                listed too.
      summary: List your API keys
      tags:
      - Account
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
    post:
      operationId: account_api_keys_create
      description: |-
        The response carries the full `key` **once**. Store it now: only a hash is kept on the
                server. Send it as `X-API-Key: <key>` or `Authorization: Api-Key <key>`.
      summary: Create an API key
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
        required: true
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The request was not valid. `fields` lists the problems for
            each input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You can see this resource but may not do this to it (`permission_denied`).
  /api/account/api-keys/{id}/:
    delete:
      operationId: account_api_keys_destroy
      summary: Revoke an API key
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Account
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '204':
          description: The key was revoked and stops working at once.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You can see this resource but may not do this to it (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The resource does not exist, or you cannot see it (`not_found`).
  /api/account/media-usage/:
    get:
      operationId: account_media_usage
      description: |-
        Bytes and file counts for images, attachments and profile pictures, and the storage
                limit (`null` when the server sets none).
      summary: Get your media storage use
      tags:
      - Account
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUsage'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
  /api/account/mobile-key/:
    get:
      operationId: account_mobile_key_retrieve
      summary: Get the mobile app key
      tags:
      - Account
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '404':
          description: No mobile key exists.
    post:
      operationId: account_mobile_key_create
      description: |-
        Creates the key and a QR code for the AdventureLog app to scan. The QR code holds JSON:
                `{"version": 1, "server_url", "api_key", "code_words"}`. Like any key, it is shown only
                in this response.
      summary: Create the mobile app key
      tags:
      - Account
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileKey'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The request was not valid. `fields` lists the problems for
            each input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You can see this resource but may not do this to it (`permission_denied`).
        '409':
          description: A mobile key already exists. Delete it first.
    delete:
      operationId: account_mobile_key_destroy
      summary: Revoke the mobile app key
      tags:
      - Account
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '204':
          description: The mobile key was revoked.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You can see this resource but may not do this to it (`permission_denied`).
  /api/account/password-login/disable/:
    post:
      operationId: account_disable_password_login
      description: |-
        Only for accounts with a linked social provider, which then becomes the only way to sign
                in. Answers `400 no_social_account` otherwise.
      summary: Turn off password sign-in
      tags:
      - Account
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordLogin'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The request was not valid. `fields` lists the problems for
            each input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You can see this resource but may not do this to it (`permission_denied`).
  /api/account/password-login/enable/:
    post:
      operationId: account_enable_password_login
      summary: Turn password sign-in back on
      tags:
      - Account
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordLogin'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The request was not valid. `fields` lists the problems for
            each input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You can see this resource but may not do this to it (`permission_denied`).
  /api/activities/:
    get:
      operationId: activities_list
      description: |-
        Activities: a hike, run, ride or other recorded outing, with distances, times and an optional GPX track.

        An activity is on a visit (of a location), on a trip day, or in a collection's Ideas.
      summary: List Activitys
      tags:
      - Activities
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
    post:
      operationId: activities_create
      description: 'Attach it to a `visit`, a trip `day`, or a `collection` (its Ideas).
        Send `multipart/form-data` with a `gpx_file` to upload a track: elevation
        and start and end points missing from the request are read from it. A day
        or Ideas activity belongs to the collection owner.'
      summary: Create an Activity
      tags:
      - Activities
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
        required: true
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The request was not valid. `fields` lists the problems for
            each input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You can see this resource but may not do this to it (`permission_denied`).
        '413':
          description: The GPX file would exceed the owner's media storage (`media_quota_exceeded`).
  /api/activities/{id}/:
    get:
      operationId: activities_retrieve
      description: |-
        Activities: a hike, run, ride or other recorded outing, with distances, times and an optional GPX track.

        An activity is on a visit (of a location), on a trip day, or in a collection's Ideas.
      summary: Get an Activity
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Activity.
        required: true
      tags:
      - Activities
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You can see this resource but may not do this to it (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The resource does not exist, or you cannot see it (`not_found`).
    put:
      operationId: activities_update
      description: |-
        Activities: a hike, run, ride or other recorded outing, with distances, times and an optional GPX track.

        An activity is on a visit (of a location), on a trip day, or in a collection's Ideas.
      summary: Replace an Activity
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Activity.
        required: true
      tags:
      - Activities
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
        required: true
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The request was not valid. `fields` lists the problems for
            each input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No valid credentials were sent (`not_authenticated`), or an
            API key was rejected (`authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You can see this resource but may not do this to it (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The resource does not exist, or you cannot see it (`not_found`).
        '413':
          description: The GPX file would exceed the owner's media storage (`media_quota_exceeded`).
    patch:
      operationId: activities_partial_update
      description: The visit, day or collection cannot be changed.
      summary: Update an Activity
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Activity.
        required: true
      tags:
      - Activities
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedActivityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedActivityRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActivityRequest'
      security:
      - ApiKeyAuth: []
      - ApiKeyAuthorization: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The request was not valid. `fields` lists the problems for
            each input.
        '401':
