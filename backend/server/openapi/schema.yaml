      responses:
        '200':
          $ref: '#/components/responses/AllauthOk'
        '401':
          $ref: '#/components/responses/AllauthUnauthenticated'
      security:
      - cookieAuth: []
    post:
      operationId: allauth_recovery_codes_regenerate
      summary: Make new recovery codes
      tags:
