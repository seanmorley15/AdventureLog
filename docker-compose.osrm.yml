# Optional override — adds a self-hosted OSRM service for route optimization
# (Fase 1 of the Trilho blueprint, docs/hub/20-decisoes/001-infra-osrm.md).
#
# NEVER merge this into docker-compose.yml: the pre-processed `.osrm*` files
# it expects under ./osrm-data are NOT part of this repo (see docs/hub/50-operacao/osrm.md
# for how to generate them), so `docker compose up` on its own must keep
# working without this file (invariant I4).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.osrm.yml up -d
#
# Then set OSRM_URL=http://osrm:5000 in .env so the backend can find it.
services:
  osrm:
    image: osrm/osrm-backend:latest
    container_name: trilho-osrm
    restart: unless-stopped
    # Safety net for the accepted-risk decision in docs/hub/20-decisoes/001-infra-osrm.md
    # (RAM estimate leaves little margin on the current 4 GB VPS): cap OSRM's
    # memory so if it balloons past the estimate, Docker kills/restarts THIS
    # container only. The rest of the stack — SecretarIA above all
    # (invariant I3) — must never go down because OSRM ran out of RAM.
    mem_limit: 2g
    volumes:
      - ./osrm-data:/data
    ports:
      - "${OSRM_PORT:-5001}:5000"
    command: osrm-routed --algorithm mld /data/region.osrm
