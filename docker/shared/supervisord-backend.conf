[supervisord]
nodaemon=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:gunicorn]
; --keep-alive must outlast Node fetch's 4s idle-socket reuse, or the frontend can reuse a
; connection gunicorn is closing ("fetch failed: other side closed"). gthread's default is 2s.
command=/bin/sh -c 'exec /usr/local/bin/gunicorn main.wsgi:application --bind [::]:8000 --workers ${GUNICORN_WORKERS:-2} --threads ${GUNICORN_THREADS:-4} --keep-alive 5 --timeout 120'
directory=/code
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:memcached]
command=memcached -u nobody -m 64 -l 127.0.0.1 -p 11211
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:worker]
; Background jobs and the schedule that replaced cron (see "Background jobs" in backend/server/API.md).
; WORKER_ENABLED=false idles this program when the worker runs in its own container instead.
command=/bin/sh -c 'if [ "${WORKER_ENABLED:-true}" = "false" ]; then exec sleep infinity; fi; exec /usr/local/bin/python3 manage.py procrastinate worker --concurrency ${WORKER_CONCURRENCY:-3}'
directory=/code
autorestart=true
; On a deploy or restart, let running jobs finish (supervisord sends TERM, then KILL after this).
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
