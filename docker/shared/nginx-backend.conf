worker_processes 1;
events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    upstream django {
        server 127.0.0.1:8000;
    }
    server {
        listen 80;
        server_name localhost;
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /static/ {
            alias /code/staticfiles/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }
        location /protectedMedia/ {
            internal;
            alias /code/media/;
            try_files $uri =404;
            add_header Content-Security-Policy "default-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # File names are random and permission is checked before this is served, so a
            # browser may keep its own copy. Never a shared cache: the file may be private.
            add_header Cache-Control "private, max-age=86400" always;
        }
    }
}
