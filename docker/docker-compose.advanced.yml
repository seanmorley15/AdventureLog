services:
  web:
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    #   target: frontend
    image: ghcr.io/seanmorley15/adventurelog-frontend:latest
    container_name: adventurelog-frontend
    restart: unless-stopped
    env_file: ../.env.advanced
    ports:
      - "${FRONTEND_PORT:-8015}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgis/postgis:16-3.5
    container_name: adventurelog-db
    restart: unless-stopped
    env_file: ../.env.advanced
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-adventure} -d ${POSTGRES_DB:-database}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional: Redis as the cache instead of the bundled memcached.
  # 1. Uncomment this service and the `redis` entry under `server.depends_on`.
  # 2. In .env.advanced set CACHE_BACKEND=redis and REDIS_URL=redis://redis:6379/0
  # redis:
  #   image: redis:7-alpine
  #   container_name: adventurelog-redis
  #   restart: unless-stopped
  #   command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

  server:
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    #   target: backend
    image: ghcr.io/seanmorley15/adventurelog-backend:latest
    container_name: adventurelog-backend
    restart: unless-stopped
    env_file: ../.env.advanced
    ports:
      - "${BACKEND_PORT:-8016}:80"
    depends_on:
      db:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
    volumes:
      - adventurelog_media:/code/media/
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/health/')\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  adventurelog_media:
